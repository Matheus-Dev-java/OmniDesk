version: "3.8"

services:
  helpdesk-postgres:
    image: postgres:16
    container_name: helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk_db
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: helpdesk_pass
    ports:
      - "5433:5432"
    volumes:
      - helpdesk-postgres-data:/var/lib/postgresql/data

volumes:
  helpdesk-postgres-data: